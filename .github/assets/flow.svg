<text x="40" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="40" dy="0">Stripe-hosted,</tspan><tspan x="40" dy="19">on the seller's</tspan><tspan x="40" dy="19">account.</tspan></text>
