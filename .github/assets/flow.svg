<text x="728" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#fafafa" opacity="0.8"><tspan x="728" dy="0">Products verify</tspan><tspan x="728" dy="19">offline, with</tspan><tspan x="728" dy="19">grace.</tspan></text>

<text x="24" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="24" dy="0">Checkout stays switched off until refund terms, tax handling and terms of service are signed off.</tspan></text>
