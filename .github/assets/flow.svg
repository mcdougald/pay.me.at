<text x="556" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="556" dy="0">Publish</tspan></text>
<text x="556" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="556" dy="0">Public keys and</tspan><tspan x="556" dy="19">revocations over</tspan><tspan x="556" dy="19">JWKS.</tspan></text>
