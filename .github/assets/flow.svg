<text x="212" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0a0a0a" font-weight="600"><tspan x="212" dy="0">Verify</tspan></text>
<text x="212" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#525252"><tspan x="212" dy="0">Webhook</tspan><tspan x="212" dy="19">signature</tspan><tspan x="212" dy="19">checked, fails</tspan><tspan x="212" dy="19">closed.</tspan></text>
